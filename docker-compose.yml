# Plateforme NeoRetail — services Docker
# Démarrage : docker compose up -d

name: neoretail

services:

  # Stockage objet compatible S3 : zone d'atterrissage, lakehouse, artefacts
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"   # API S3 (utilisée par les programmes)
      - "8888:8888"   # interface web : navigation dans les fichiers
      - "9333:9333"   # interface web : état du stockage
    volumes:
      - seaweedfs-data:/data

  # Tâche ponctuelle : crée les espaces de stockage (buckets) puis s'arrête
  s3-init:
    image: amazon/aws-cli:latest
    container_name: s3-init
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        S3="aws --endpoint-url http://seaweedfs:8333"
        for i in $$(seq 1 30); do $$S3 s3 ls > /dev/null 2>&1 && break; echo "Attente du stockage S3..."; sleep 2; done
        for b in landing lakehouse mlflow datadocs; do $$S3 s3 mb s3://$$b 2>/dev/null || echo "Bucket $$b deja present"; done
        $$S3 s3 ls
        echo "Buckets prets"

volumes:
  seaweedfs-data: